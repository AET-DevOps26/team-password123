name: Build & Push Images

# Builds all service images (linux/amd64) and pushes them to GHCR so the
# Kubernetes cluster can pull them.
#
# Runs AFTER "CI" succeeds on main (via workflow_run): images are only produced
# from a green build (tests + lint passed). Since deploy-aet.yml keys off THIS
# workflow, the full gate is CI → build → deploy — a failing test can no longer
# reach the cluster. Manual dispatch rebuilds the current ref on demand.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Only build when the triggering CI run passed (or on manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: auth-service
            context: services/auth-service
          - name: meals-service
            context: services/meals-service
          - name: analytics-service
            context: services/analytics-service
          - name: genai-service
            context: services/genai-service
          - name: web
            context: calorie-app
    steps:
      # On workflow_run the default checkout ref is the branch tip, which may be
      # ahead of the commit CI actually tested; pin to the tested SHA so the
      # image tag matches what deploy-aet.yml resolves (workflow_run.head_sha
      # propagates through the chain).
      - name: Resolve build ref
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.ctx.outputs.ref }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner/name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.name }}:latest
            ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.name }}:${{ steps.ctx.outputs.ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain attestations attached to each GHCR image: an SBOM of the
          # image contents and SLSA build provenance.
          sbom: true
          provenance: mode=max
