name: Build & Push Images

# Builds all service images (linux/amd64) and pushes them to GHCR so the
# Kubernetes cluster can pull them.
#
# Reusable workflow: ci.yml calls it (workflow_call) after all test jobs pass
# on a push to main, so images are only produced from a green build and the
# runner itself enforces the CI → build → deploy gate via `needs`. In that
# context github.sha IS the tested commit — no head_sha resolution needed.
# Manual dispatch rebuilds the current ref on demand, but only main builds
# move the `latest` tag (see the metadata step).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Spring services build from the services/ context so their
          # Dockerfiles can include the shared common-security module.
          - name: auth-service
            context: services
            dockerfile: services/auth-service/Dockerfile
          - name: meals-service
            context: services
            dockerfile: services/meals-service/Dockerfile
          - name: analytics-service
            context: services
            dockerfile: services/analytics-service/Dockerfile
          - name: genai-service
            context: services/genai-service
            dockerfile: services/genai-service/Dockerfile
          - name: web
            context: calorie-app
            dockerfile: calorie-app/Dockerfile
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository owner/name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # `latest` only moves for main builds (chain calls from ci.yml are always
      # main; enable= covers manual dispatches): deploy-azure pulls
      # image_tag=latest, so a feature-branch dispatch retagging `latest` would
      # bypass the CI → build → deploy gate with untested code. A non-main
      # dispatch still pushes its immutable SHA tag.
      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build & push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain attestations attached to each GHCR image: an SBOM of the
          # image contents and SLSA build provenance.
          sbom: true
          provenance: mode=max
