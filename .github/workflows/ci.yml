name: CI

# CI + CD entry point: builds and tests every service on each PR and on pushes
# to main. This workflow is the enforcement point for system stability — branch
# protection on `main` should require these jobs as status checks.
#
# On push to main, the trailing `build-images` and `deploy-aet` jobs call the
# reusable workflows of the same names (by FILE PATH, so a rename/move fails
# the run loudly), giving the full gate CI → build → deploy in one run graph.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded PR runs to save runner minutes. Pushes to main queue
# instead: a main run may be mid-deploy, and cancelling it would abort a Helm
# rollout halfway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, meals-service, analytics-service]
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # The services depend on the shared common-security module, which must be
      # in the local repository before a service can resolve it.
      - name: Install shared common-security module
        working-directory: services/common-security
        run: mvn -B -ntp install

      # `verify` compiles, runs the unit tests, and packages the deployable
      # (Spring Boot repackage) — i.e. it both builds AND tests the service.
      - name: Build & test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (web client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calorie-app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: calorie-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Fail on known high/critical CVEs in packages that ship to production.
      # devDependencies (vite/vitest toolchain) are excluded: their dev-server
      # advisories don't reach the built bundle, and fixing them means major
      # toolchain bumps that Dependabot proposes separately.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # `npm run build` = `tsc && vite build`: strict typecheck + production build.
      - name: Typecheck & build
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calorie-app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: calorie-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only Chromium is configured in playwright.config.ts.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright's webServer boots `npm run dev` on port 4173; tests exercise
      # the real API code paths with all /api/* calls intercepted by route
      # mocks. CI mode adds 2 retries and emits an HTML report.
      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: calorie-app/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  e2e-smoke:
    name: E2E smoke (real stack)
    runs-on: ubuntu-latest
    # Docker image builds dominate this job; bound it so a stalled build or
    # download can't run to the 360-minute default.
    timeout-minutes: 30
    # Compose interpolates the WHOLE file before deciding which services to
    # start, so every `:?`-guarded variable needs a value even for services
    # that never run (grafana). Dummy CI-only values; the JWT keypair is
    # generated per run in the step below.
    env:
      POSTGRES_PASSWORD: ci-only-postgres-password
      GRAFANA_ADMIN_PASSWORD: ci-only-grafana-password-unused
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: calorie-app/package-lock.json

      # Satisfies compose's APP_JWT_PRIVATE_KEY/APP_JWT_PUBLIC_KEY guards with a
      # fresh throwaway pair per run — CI never needs the real deploy keys. Uses
      # the repo's own generator, which already prints the two `NAME=value` lines
      # $GITHUB_ENV wants, so CI exercises the same PKCS#8/SPKI encoding that
      # local dev and the deploys use. (`openssl genpkey -outform DER` emits
      # PKCS#1, which PemKeys' PKCS8EncodedKeySpec rejects.)
      - name: Generate throwaway JWT keypair
        run: node scripts/gen-jwt-keys.mjs >> "$GITHUB_ENV"

      # Only what the smoke flow needs: register/login (auth), manual meal +
      # diary (meals). genai/weaviate are deliberately skipped — POST
      # /api/meals/manual never calls the analyzer — and --no-deps keeps
      # compose from dragging them in. analytics-service stays down too: every
      # call to it in the exercised flow is non-blocking in the app.
      - name: Start backend stack (postgres, auth, meals)
        run: |
          docker compose up -d --build postgres auth-service
          docker compose up -d --no-deps --build meals-service

      # Both actuator health endpoints are unauthenticated; poll until UP with
      # a hard timeout so a broken boot fails fast instead of hanging the job.
      - name: Wait for services to be healthy
        run: |
          for url in http://localhost:8081/actuator/health http://localhost:8082/actuator/health; do
            for i in $(seq 1 60); do
              if curl -sf "$url" > /dev/null; then
                echo "$url is up"
                continue 2
              fi
              sleep 5
            done
            echo "::error::$url did not become healthy within its 300s poll window"
            docker compose logs
            exit 1
          done

      - name: Install dependencies
        working-directory: calorie-app
        run: npm ci

      # Only Chromium is configured in playwright.config.ts.
      - name: Install Playwright browser
        working-directory: calorie-app
        run: npx playwright install --with-deps chromium

      # E2E_REAL_STACK=1 un-skips the real-stack spec; Playwright's webServer
      # boots the Vite dev server, whose proxy routes /api/* to the compose
      # services on localhost:8081/8082 (no route mocks anywhere in the spec).
      - name: Run real-stack smoke test
        working-directory: calorie-app
        env:
          E2E_REAL_STACK: '1'
        run: npx playwright test e2e/real-stack.spec.ts

      - name: Dump compose logs on failure
        if: failure()
        run: docker compose logs

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-real-stack
          path: calorie-app/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  genai:
    name: GenAI service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/genai-service
    steps:
      - uses: actions/checkout@v7

      # Match the service Dockerfile (python:3.11-slim) so the pinned deps resolve.
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/genai-service/requirements.txt

      - name: Install dependencies
        run: |
          # setuptools too: pip-audit audits the whole environment, and the
          # runner's preinstalled setuptools trips known CVEs (e.g. PYSEC-2026-3447).
          python -m pip install --upgrade pip setuptools
          pip install -r requirements.txt ruff pip-audit pip-tools

      # The Dockerfile installs the pinned lock (requirements.txt). Recompile it
      # from requirements.in and fail if it drifted, so the floors source and the
      # audited/shipped lock can never silently diverge. Recompiling in place keeps
      # existing pins stable (pip-compile reads the committed lock as the baseline),
      # so this only trips when requirements.in changes or a pin stops satisfying it.
      - name: Verify requirements lock is in sync
        run: |
          pip-compile --strip-extras requirements.in
          git diff --exit-code -- requirements.txt \
            || { echo "::error::requirements.txt is out of date — run 'pip-compile --strip-extras requirements.in' and commit the result."; exit 1; }

      - name: Lint (ruff)
        run: ruff check .

      # Fail on known CVEs in the resolved environment (the installed pinned lock +
      # transitives). Complements Dependabot: Dependabot proposes update PRs, this
      # gate stops a merge that would ship an already-known-vulnerable dependency set.
      - name: Audit dependencies (pip-audit)
        run: pip-audit --skip-editable

      # Run the whole tests/ directory so newly added test files are picked up
      # automatically — no hand-maintained file list to silently fall out of date.
      # `-m "not integration"` drops the live-LLM tests (need API keys);
      # test_smoke / test_image_expectations self-skip without a running :8084;
      # test_rag_eval has its own step below (needs the real embedding model).
      # These cover the critical nutrition + RAG logic: curated-DB lookup,
      # name-based portion estimation, the retrieve→augment→generate insight path,
      # and the Gemini-primary → Nemotron-backup vision fallback (all mocked).
      - name: Unit tests
        run: pytest tests/ -m "not integration" --ignore=tests/test_rag_eval.py -v

      # Retrieval-quality eval: prints a recall@1/@5/MRR table for the RAG. Uses the
      # real fastembed model; self-skips if the model can't download in CI, so it
      # never fails the pipeline for an environment reason.
      - name: RAG retrieval eval
        run: pytest tests/test_rag_eval.py -v -s

      # Optional live smoke against OpenRouter Nemotron. Skips (does not fail) on
      # 429 quota or timeout — the free pool is often congested in CI.
      # push-only: on pull_request this step would run PR-authored pytest code
      # with OPENROUTER_API_KEY in the env, letting a malicious PR exfiltrate the
      # key. Restricting to push (main) keeps the secret away from untrusted code.
      - name: Backup vision smoke (OpenRouter)
        if: github.event_name == 'push'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BACKUP_OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BACKUP_VISION_TIMEOUT_SEC: "45"
        run: pytest tests/test_vision_fallback.py -v -m "integration and backup"

  helm:
    name: Helm chart (lint + kubeconform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Same pin as deploy-aet.yml, so CI validates with the Helm that deploys.
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      # The chart `require`s four values (JWT keypair, postgres password,
      # Grafana admin password); dummy --set values satisfy them.
      # Rendered twice — defaults, and with the A/B canary tier enabled — so
      # web-canary.yaml doesn't rot unvalidated behind its off-by-default flag.
      - name: Lint and render chart
        run: |
          SET='--set jwt.privateKey=ci --set jwt.publicKey=ci --set postgres.password=ci --set monitoring.grafana.adminPassword=ci'
          helm lint helm/calorieasy $SET
          helm template app helm/calorieasy $SET > rendered-default.yaml
          helm template app helm/calorieasy $SET \
            --set abTest.enabled=true --set abTest.imageTag=ci > rendered-canary.yaml

      # Schema-validate the rendered manifests against the Kubernetes OpenAPI
      # specs — catches typos (bad apiVersion, misplaced fields) that only an
      # actual deploy would have surfaced before.
      - name: Validate manifests (kubeconform)
        run: |
          VERSION=0.6.7
          curl -sSfL "https://github.com/yannh/kubeconform/releases/download/v${VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
          ./kubeconform -strict -summary rendered-default.yaml rendered-canary.yaml

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Full history so gitleaks scans every commit, not just the tip.
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --verbose

  vuln-scan:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Filesystem scan of dependency manifests (pom.xml, requirements.txt,
      # package-lock.json) for known CVEs. Blocking: the initial backlog was
      # triaged 2026-07-16 (zero fixable HIGH/CRITICAL findings), so any hit
      # now is a regression and must fail the merge. Accepted findings, if any
      # ever accumulate, go in a root .trivyignore with a justification per entry.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table

  # ---------------------------------------------------------------------------
  # CD chain — push to main only. Referenced by file path (uses:), so the
  # dependency is checked by the runner itself: a failing test blocks the build,
  # a failed build blocks the deploy, and a renamed workflow file fails the run
  # loudly.
  # ---------------------------------------------------------------------------
  build-images:
    name: Build & push images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, e2e, e2e-smoke, genai, helm, secret-scan, vuln-scan]
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    permissions:
      contents: read
      packages: write

  deploy-aet:
    name: Deploy to AET
    needs: build-images
    uses: ./.github/workflows/deploy-aet.yml
    secrets: inherit
    permissions:
      contents: read
