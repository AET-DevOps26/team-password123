name: CI

# Continuous Integration: builds and tests every service on each PR and on
# pushes to main. This workflow is the enforcement point for system stability —
# branch protection on `main` should require these jobs as status checks.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, meals-service, analytics-service]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` compiles, runs the unit tests, and packages the deployable
      # (Spring Boot repackage) — i.e. it both builds AND tests the service.
      - name: Build & test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (web client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calorie-app
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: calorie-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `npm run build` = `tsc && vite build`: strict typecheck + production build.
      - name: Typecheck & build
        run: npm run build

      - name: Unit tests
        run: npm test
