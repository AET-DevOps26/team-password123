name: CI

# Continuous Integration: builds and tests every service on each PR and on
# pushes to main. This workflow is the enforcement point for system stability —
# branch protection on `main` should require these jobs as status checks.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [auth-service, meals-service, analytics-service]
    steps:
      - uses: actions/checkout@v7
        # Full history so Spotless's `ratchetFrom origin/main` can diff against
        # main and only enforce formatting on changed Java.
        with:
          fetch-depth: 0

      # On PR builds checkout only wires up the PR ref, so make origin/main
      # resolvable for the ratchet (no-op when already building main).
      - name: Fetch main for Spotless ratchet
        run: git fetch --no-tags origin main:refs/remotes/origin/main || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # `verify` compiles, runs the unit tests, and packages the deployable
      # (Spring Boot repackage) — i.e. it both builds AND tests the service.
      - name: Build & test ${{ matrix.service }}
        working-directory: services/${{ matrix.service }}
        run: mvn -B -ntp verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.service }}
          path: services/${{ matrix.service }}/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend (web client)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calorie-app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: calorie-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # `npm run build` = `tsc && vite build`: strict typecheck + production build.
      - name: Typecheck & build
        run: npm run build

      - name: Unit tests
        run: npm test

  e2e:
    name: Frontend e2e (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: calorie-app
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node 20
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: calorie-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Only Chromium is configured in playwright.config.ts.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Playwright's webServer boots `npm run dev` on port 4173; tests exercise
      # the real API code paths with all /api/* calls intercepted by route
      # mocks. CI mode adds 2 retries and emits an HTML report.
      - name: Run e2e tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: calorie-app/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  genai:
    name: GenAI service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/genai-service
    steps:
      - uses: actions/checkout@v7

      # Match the service Dockerfile (python:3.11-slim) so the pinned deps resolve.
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/genai-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint (ruff)
        run: ruff check .

      # Run the whole tests/ directory so newly added test files are picked up
      # automatically — no hand-maintained file list to silently fall out of date.
      # `-m "not integration"` drops the live-LLM tests (need API keys);
      # test_smoke / test_image_expectations self-skip without a running :8084;
      # test_rag_eval has its own step below (needs the real embedding model).
      # These cover the critical nutrition + RAG logic: curated-DB lookup,
      # name-based portion estimation, the retrieve→augment→generate insight path,
      # and the Gemini-primary → Nemotron-backup vision fallback (all mocked).
      - name: Unit tests
        run: pytest tests/ -m "not integration" --ignore=tests/test_rag_eval.py -v

      # Retrieval-quality eval: prints a recall@1/@5/MRR table for the RAG. Uses the
      # real fastembed model; self-skips if the model can't download in CI, so it
      # never fails the pipeline for an environment reason.
      - name: RAG retrieval eval
        run: pytest tests/test_rag_eval.py -v -s

      # Optional live smoke against OpenRouter Nemotron. Skips (does not fail) on
      # 429 quota or timeout — the free pool is often congested in CI.
      # push-only: on pull_request this step would run PR-authored pytest code
      # with OPENROUTER_API_KEY in the env, letting a malicious PR exfiltrate the
      # key. Restricting to push (main) keeps the secret away from untrusted code.
      - name: Backup vision smoke (OpenRouter)
        if: github.event_name == 'push'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BACKUP_OPENAI_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BACKUP_VISION_TIMEOUT_SEC: "45"
        run: pytest tests/test_vision_fallback.py -v -m "integration and backup"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # Full history so gitleaks scans every commit, not just the tip.
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          VERSION=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --verbose

  vuln-scan:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Filesystem scan of dependency manifests (pom.xml, requirements.txt,
      # package-lock.json) and Dockerfiles for known CVEs. Report-only for now
      # (exit-code 0) so it surfaces findings without blocking merges; flip
      # exit-code to '1' once the initial backlog is triaged.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: table
