name: Deploy to AET cluster

# Continuous deployment of the Helm chart to the AET Kubernetes cluster.
#
# Reusable workflow: ci.yml calls it (workflow_call) after "Build & Push Images"
# succeeds on a push to main, so the freshly built images exist before we deploy
# and the runner enforces the ordering via `needs`. It deploys by the built
# commit SHA (not the moving `latest` tag) — an immutable tag changes the
# Deployment template on every release, which guarantees a rollout instead of
# leaving pods pinned to a stale `latest`.
on:
  workflow_call:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (default latest)
        default: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aet
    # Job-level (not workflow-level) so it also applies when this workflow runs
    # as a reusable job inside the CI run: one deploy at a time, never cancelled
    # mid-rollout.
    concurrency:
      group: deploy-aet
      cancel-in-progress: false
    steps:
      # In the workflow_call chain github.sha is the commit CI tested and
      # build-images tagged; manual dispatch deploys a caller-chosen tag.
      - name: Resolve image tag
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # Default checkout ref is github.sha — the chart at the SAME commit that
      # was built, so chart + images match.
      - uses: actions/checkout@v7

      - name: Write kubeconfig (base64 of stud.yaml in KUBECONFIG_B64)
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      # Pin Helm: an unpinned setup-helm silently jumped 3.x -> 4.x, which
      # changed --wait semantics and broke deploys. Pin to the version that
      # already manages this release so the version can't drift under us again.
      - uses: azure/setup-helm@v4
        with:
          version: v4.2.3

      - name: Ensure GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password='${{ secrets.GHCR_PULL_TOKEN }}' \
            --namespace team-password123 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm upgrade (image tag ${{ steps.ctx.outputs.tag }})
        run: |
          # Photo-scan vision = Google Gemini (active). To swap to Logos gemma-4 once
          # AET grants google/gemma-4-26B-A4B-it to the key, replace the three
          # genai.openai* --set lines below with:
          #   --set genai.openaiBaseUrl="https://logos.aet.cit.tum.de/v1"
          #   --set genai.openaiModel="google/gemma-4-26B-A4B-it"
          #   --set genai.openaiApiKey="${{ secrets.LOGOS_API_KEY }}"
          helm upgrade --install app helm/calorieasy \
            --namespace team-password123 \
            --set image.tag="${{ steps.ctx.outputs.tag }}" \
            --set jwt.privateKey="${{ secrets.APP_JWT_PRIVATE_KEY }}" \
            --set jwt.publicKey="${{ secrets.APP_JWT_PUBLIC_KEY }}" \
            --set postgres.password="${{ secrets.POSTGRES_PASSWORD }}" \
            --set monitoring.grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --set genai.openaiApiKey="${{ secrets.GEMINI_API_KEY }}" \
            --set genai.backupOpenaiApiKey="${{ secrets.OPENROUTER_API_KEY }}" \
            --set genai.textOpenaiBaseUrl="${{ secrets.LOGOS_BASE_URL }}" \
            --set genai.textOpenaiModel="${{ vars.LOGOS_MODEL || 'openai/gpt-oss-120b' }}" \
            --set genai.textOpenaiApiKey="${{ secrets.LOGOS_API_KEY }}" \
            --rollback-on-failure --timeout 20m
          # 20m (not 8m): a fresh-SHA rollout pulls ~6 Spring Boot images onto
          # separate AET nodes and each pod's startupProbe allows up to 150s, so
          # 8m regularly expired mid-rollout and rolled prod back to the previous
          # (stale) images. The app converges in ~10m; 20m gives margin.
          # --rollback-on-failure (the Helm 4 replacement for the deprecated
          # --atomic) defaults --wait to "watcher" and auto-rolls-back to the last
          # good release if the rollout fails within the timeout, so a broken
          # deploy self-heals instead of leaving half-updated pods.

      - name: Show rollout
        run: kubectl get pods -n team-password123
