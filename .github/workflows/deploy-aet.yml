name: Deploy to AET cluster

# Continuous deployment of the Helm chart to the AET Kubernetes cluster.
#
# Ordering: this runs AFTER "Build & Push Images" succeeds (via workflow_run), so
# the freshly built images exist before we deploy. It deploys by the built commit
# SHA (not the moving `latest` tag) — an immutable tag changes the Deployment
# template on every release, which guarantees a rollout instead of leaving pods
# pinned to a stale `latest`.
on:
  workflow_run:
    workflows: ["Build & Push Images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to deploy (default latest)
        default: latest

concurrency:
  group: deploy-aet
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aet
    # Only deploy when the triggering build succeeded (or on a manual dispatch).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Resolve deploy ref + image tag
        id: ctx
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "ref=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          fi

      # Check out the chart at the SAME commit that was built, so chart + images match.
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.ctx.outputs.ref }}

      - name: Write kubeconfig (base64 of stud.yaml in KUBECONFIG_B64)
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - uses: azure/setup-helm@v4

      - name: Ensure GHCR pull secret
        run: |
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password='${{ secrets.GHCR_PULL_TOKEN }}' \
            --namespace team-password123 \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Helm upgrade (image tag ${{ steps.ctx.outputs.tag }})
        run: |
          # Photo-scan vision = Google Gemini (active). To swap to Logos gemma-4 once
          # AET grants google/gemma-4-26B-A4B-it to the key, replace the three
          # genai.openai* --set lines below with:
          #   --set genai.openaiBaseUrl="https://logos.aet.cit.tum.de/v1"
          #   --set genai.openaiModel="google/gemma-4-26B-A4B-it"
          #   --set genai.openaiApiKey="${{ secrets.LOGOS_API_KEY }}"
          helm upgrade --install app helm/calorieasy \
            --namespace team-password123 \
            --set image.tag="${{ steps.ctx.outputs.tag }}" \
            --set jwt.secret="${{ secrets.APP_JWT_SECRET }}" \
            --set postgres.password="${{ secrets.POSTGRES_PASSWORD }}" \
            --set monitoring.grafana.adminPassword="${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            --set genai.openaiApiKey="${{ secrets.GEMINI_API_KEY }}" \
            --set genai.backupOpenaiApiKey="${{ secrets.OPENROUTER_API_KEY }}" \
            --set genai.textOpenaiBaseUrl="${{ secrets.LOGOS_BASE_URL }}" \
            --set genai.textOpenaiModel="${{ vars.LOGOS_MODEL || 'openai/gpt-oss-120b' }}" \
            --set genai.textOpenaiApiKey="${{ secrets.LOGOS_API_KEY }}" \
            --atomic --timeout 8m
          # --atomic implies --wait and auto-rolls-back to the last good release if
          # the rollout fails within the timeout, so a broken deploy self-heals
          # instead of leaving half-updated pods.

      - name: Show rollout
        run: kubectl get pods -n team-password123
