server {
    # Unprivileged nginx (non-root uid 101) cannot bind <1024; listen high.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow meal photo uploads.
    client_max_body_size 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # API reverse proxy — mirrors the dev routing in vite.config.ts.
    # Controllers are mapped under /api/*, so the path is forwarded unchanged.
    location /api/auth      { proxy_pass http://auth-service:8081; }
    location /api/users     { proxy_pass http://auth-service:8081; }
    location /api/features  { proxy_pass http://auth-service:8081; }
    location /api/meals     { proxy_pass http://meals-service:8082; }
    location /api/analytics { proxy_pass http://analytics-service:8083; }
    location /api/goals     { proxy_pass http://analytics-service:8083; }

    # SPA fallback — all other routes return the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
