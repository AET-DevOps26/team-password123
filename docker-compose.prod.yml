# Production compose for the Azure VM deploy. Pulls prebuilt GHCR images (no build).
# Secrets and the image tag come from a .env file placed next to this file on the host
# (Ansible templates it). Bring up with: docker compose -f docker-compose.prod.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrition}
      POSTGRES_USER: ${POSTGRES_USER:-nutrition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutrition}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/aet-devops26/team-password123}/auth-service:${IMAGE_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nutrition}?currentSchema=auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nutrition}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-PT24H}
      SERVER_PORT: 8081
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  meals-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/aet-devops26/team-password123}/meals-service:${IMAGE_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nutrition}?currentSchema=meals
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nutrition}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?}
      APP_UPLOAD_DIR: /app/uploads
      SERVER_PORT: 8082
    volumes:
      - meals-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/aet-devops26/team-password123}/analytics-service:${IMAGE_TAG:-latest}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nutrition}?currentSchema=analytics
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nutrition}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?}
      MEALS_SERVICE_URL: http://meals-service:8082
      SERVER_PORT: 8083
    depends_on:
      postgres:
        condition: service_healthy
      meals-service:
        condition: service_started
    restart: unless-stopped

  genai-service:
    image: ${IMAGE_REGISTRY:-ghcr.io/aet-devops26/team-password123}/genai-service:${IMAGE_TAG:-latest}
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BACKUP_OPENAI_BASE_URL: ${BACKUP_OPENAI_BASE_URL:-}
      BACKUP_OPENAI_MODEL: ${BACKUP_OPENAI_MODEL:-}
      BACKUP_OPENAI_API_KEY: ${BACKUP_OPENAI_API_KEY:-}
      NUTRITION_DATA_PROVIDER: ${NUTRITION_DATA_PROVIDER:-local}
      PORT: 8084
    restart: unless-stopped

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/aet-devops26/team-password123}/web:${IMAGE_TAG:-latest}
    ports:
      - "80:80"
    depends_on:
      - auth-service
      - meals-service
      - analytics-service
    restart: unless-stopped

volumes:
  postgres-data:
  meals-uploads:
