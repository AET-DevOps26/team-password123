services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrition}
      POSTGRES_USER: ${POSTGRES_USER:-nutrition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nutrition}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutrition}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nutrition}?currentSchema=auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nutrition}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-nutrition}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-development-secret-change-me-please-1234567890}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-PT24H}
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  meals-service:
    build: ./services/meals-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nutrition}?currentSchema=meals
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nutrition}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-nutrition}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-development-secret-change-me-please-1234567890}
      APP_UPLOAD_DIR: /app/uploads
      # Points the photo-scan flow at the GenAI vision service. Setting this
      # activates GenAiMealAnalyzer; unset (e.g. local non-compose runs) the
      # deterministic HeuristicMealAnalyzer stays the safe default.
      APP_GENAI_BASE_URL: http://genai-service:8084
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    volumes:
      - meals-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      genai-service:
        condition: service_started

  analytics-service:
    build: ./services/analytics-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nutrition}?currentSchema=analytics
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nutrition}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-nutrition}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-local-development-secret-change-me-please-1234567890}
      MEALS_SERVICE_URL: http://meals-service:8082
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      meals-service:
        condition: service_started

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_AUTH_API_URL: http://auth-service:8081
      VITE_MEALS_API_URL: http://meals-service:8082
      VITE_ANALYTICS_API_URL: http://analytics-service:8083
      VITE_MOCK_MODE: "false"
      VITE_OFFLINE_MODE: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./calorie-app:/app
      - web-node-modules:/app/node_modules
    depends_on:
      auth-service:
        condition: service_started
      meals-service:
        condition: service_started
      analytics-service:
        condition: service_started
  genai-service:
    build: ./services/genai-service
    environment:
      # Default: free local Ollama (run `ollama pull llava` on the host first).
      # For cloud vision, set LLM_PROVIDER=openai + OPENAI_* in your gitignored
      # root .env (works with OpenAI or any OpenAI-compatible gateway). Never
      # commit the key.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llava}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      PORT: 8084
      DEBUG: "false"
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8084/health', timeout=3); raise SystemExit(0 if r.status_code == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres-data:
  meals-uploads:
  web-node-modules:
