services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrition}
      POSTGRES_USER: ${POSTGRES_USER:-nutrition}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutrition}"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nutrition}?currentSchema=auth
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nutrition}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      APP_JWT_EXPIRATION: ${APP_JWT_EXPIRATION:-PT24H}
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  meals-service:
    build: ./services/meals-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nutrition}?currentSchema=meals
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nutrition}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      APP_UPLOAD_DIR: /app/uploads
      # Points the photo-scan flow at the GenAI vision service. Setting this
      # activates GenAiMealAnalyzer; unset (e.g. local non-compose runs) the
      # deterministic HeuristicMealAnalyzer stays the safe default.
      APP_GENAI_BASE_URL: http://genai-service:8084
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    volumes:
      - meals-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      genai-service:
        condition: service_started

  analytics-service:
    build: ./services/analytics-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-nutrition}?currentSchema=analytics
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-nutrition}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?set APP_JWT_SECRET in .env}
      MEALS_SERVICE_URL: http://meals-service:8082
      # RAG health-insights: analytics aggregates recent meals and asks genai
      # to generate the grounded insight.
      GENAI_URL: ${GENAI_URL:-http://genai-service:8084}
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      meals-service:
        condition: service_started
      genai-service:
        condition: service_started

  web:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_AUTH_API_URL: http://auth-service:8081
      VITE_MEALS_API_URL: http://meals-service:8082
      VITE_ANALYTICS_API_URL: http://analytics-service:8083
    ports:
      - "3000:3000"
    volumes:
      - ./calorie-app:/app
      - web-node-modules:/app/node_modules
    depends_on:
      auth-service:
        condition: service_started
      meals-service:
        condition: service_started
      analytics-service:
        condition: service_started
  genai-service:
    build: ./services/genai-service
    environment:
      # Default: free local Ollama (run `ollama pull llava` on the host first).
      # For cloud vision, set LLM_PROVIDER=openai + OPENAI_* in your gitignored
      # root .env (works with OpenAI or any OpenAI-compatible gateway). Never
      # commit the key.
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llava}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # Optional dedicated text LLM for food-name estimation (e.g. Logos).
      # When set, the estimate endpoint uses this instead of the vision LLM.
      TEXT_OPENAI_BASE_URL: ${TEXT_OPENAI_BASE_URL:-}
      TEXT_OPENAI_API_KEY: ${TEXT_OPENAI_API_KEY:-}
      TEXT_OPENAI_MODEL: ${TEXT_OPENAI_MODEL:-openai/gpt-oss-120b}
      PORT: 8084
      DEBUG: "false"
      # RAG health-insights: Weaviate vector store + embedding provider.
      # local = in-process fastembed (no key); openai = cloud embeddings.
      WEAVIATE_URL: ${WEAVIATE_URL:-http://weaviate:8080}
      EMBED_PROVIDER: ${EMBED_PROVIDER:-local}
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      weaviate:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; r = requests.get('http://localhost:8084/health', timeout=3); raise SystemExit(0 if r.status_code == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Vector store backing the GenAI health-insights RAG. We supply our own vectors
  # (vectorizer=none), so no Weaviate inference modules are needed.
  weaviate:
    image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
    command: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
    environment:
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
      DEFAULT_VECTORIZER_MODULE: none
      ENABLE_MODULES: ""
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      QUERY_DEFAULTS_LIMIT: "25"
      CLUSTER_HOSTNAME: node1
      PROMETHEUS_MONITORING_ENABLED: "true"   # exposes /metrics on :2112
    ports:
      - "8080:8080"
    volumes:
      - weaviate-data:/var/lib/weaviate

  # Observability — same stack as the Helm chart, for local dev. Prometheus
  # scrapes the services (names match k8s); Grafana auto-provisions the datasource.
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./helm/calorieasy/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - auth-service
      - meals-service
      - analytics-service
      - genai-service

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      # No baked-in credentials — set GRAFANA_ADMIN_PASSWORD in .env, same as
      # POSTGRES_PASSWORD/APP_JWT_SECRET. The deployed chart sources it from a Secret.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/metrics/calorieasy-overview.json
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      # Metrics dashboards are shared with the Helm chart; logs dashboards are
      # compose-only (Loki isn't in the chart yet). Both land under one dir so a
      # single provider picks them up.
      - ./helm/calorieasy/dashboards:/var/lib/grafana/dashboards/metrics:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards/logs:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"   # web uses 3000 locally, so Grafana is on 3001
    depends_on:
      - prometheus
      - loki

  # Loki stores logs; runs on its built-in single-binary filesystem config.
  loki:
    image: grafana/loki:3.1.1
    command: -config.file=/etc/loki/local-config.yaml
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki

  # Promtail tails every container's logs via the Docker socket and pushes to Loki.
  promtail:
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/config.yml
    user: root
    volumes:
      - ./infra/monitoring/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - loki

  # Hammers every endpoint in a loop so the dashboards always have live data.
  # Disable by commenting this out (or `docker compose stop load-generator`).
  load-generator:
    image: python:3.12-alpine
    command: python /loadgen.py
    environment:
      LOADGEN_SLEEP: ${LOADGEN_SLEEP:-1.5}
    volumes:
      - ./scripts/load-generator/loadgen.py:/loadgen.py:ro
    depends_on:
      auth-service:
        condition: service_started
      meals-service:
        condition: service_started
      analytics-service:
        condition: service_started

volumes:
  postgres-data:
  meals-uploads:
  web-node-modules:
  prometheus-data:
  grafana-data:
  loki-data:
  weaviate-data:
