# Prometheus alerting rules — single source of truth for both the Helm chart
# (loaded via .Files.Get in templates/monitoring-prometheus.yaml) and local
# docker-compose (mounted into the prometheus service). Prometheus evaluates
# these and shows firing alerts on its /alerts page; routing to email/Slack
# would additionally need Alertmanager (not required for the rubric).
groups:
  - name: calorieasy
    rules:
      # Service down: any scrape target (auth/meals/analytics/genai or Prometheus
      # itself) unreachable for 2 minutes. `up` is synthesised per target by
      # Prometheus, so this fires regardless of app-level instrumentation.
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.job }} is down"
          description: "Prometheus target {{ $labels.job }} ({{ $labels.instance }}) has been unreachable for 2m."

      # Slow responses: a Spring service's p95 request latency above 1s for 5m.
      # All three services publish percentiles-histogram buckets, so the _bucket
      # series this needs exists.
      - alert: HighRequestLatency
        expr: |
          histogram_quantile(
            0.95,
            sum by (job, le) (rate(http_server_requests_seconds_bucket[5m]))
          ) > 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency on {{ $labels.job }}"
          description: "{{ $labels.job }} p95 request latency has been above 1s for 5m."

      # High error rate: more than 5% of a Spring service's HTTP requests
      # returning 5xx over the last 5 minutes.
      - alert: HighServerErrorRate
        expr: |
          sum by (job) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            /
          sum by (job) (rate(http_server_requests_seconds_count[5m]))
            > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate on {{ $labels.job }}"
          description: "{{ $labels.job }} is serving more than 5% 5xx responses over the last 5m."
