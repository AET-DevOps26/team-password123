apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
    {{- include "calorieasy.labels" . | nindent 4 }}
spec:
  {{- if not (include "calorieasy.hpaManaged" (dict "root" $ "name" "auth-service")) }}
  replicas: 1
  {{- end }}
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done']
      containers:
        - name: auth-service
          image: {{ include "calorieasy.image" (dict "root" $ "name" "auth-service") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8081
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://postgres:5432/{{ .Values.postgres.db }}?currentSchema=auth"
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.postgres.user | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "calorieasy.secretName" . }}
                  key: POSTGRES_PASSWORD
            - name: APP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "calorieasy.secretName" . }}
                  key: APP_JWT_SECRET
            - name: APP_JWT_EXPIRATION
              value: {{ .Values.jwt.expiration | quote }}
            {{- if .Values.tracing.enabled }}
            - name: MANAGEMENT_TRACING_ENABLED
              value: "true"
            - name: MANAGEMENT_OTLP_TRACING_ENDPOINT
              value: {{ .Values.tracing.otlpEndpoint | quote }}
            {{- end }}
          startupProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: { path: /actuator/health, port: 8081 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8081 }
            periodSeconds: 15
          resources:
            {{- toYaml .Values.java.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    app: auth-service
    {{- include "calorieasy.labels" . | nindent 4 }}
spec:
  selector:
    app: auth-service
  ports:
    - port: 8081
      targetPort: 8081
