{{- if .Values.autoscaling.enabled }}
{{- $a := .Values.autoscaling }}
{{- range $name, $t := $a.targets }}
---
# CPU HorizontalPodAutoscaler for {{ $name }}. Scale-UP only under sustained load
# (high target + a stabilization window); scale-DOWN inherits Kubernetes' default
# 300s window — conservative on purpose, no need to restate it.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "calorieasy.labels" $ | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $t.minReplicas }}
  maxReplicas: {{ $t.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $t.targetCPUUtilizationPercentage | default $a.targetCPUUtilizationPercentage }}
  behavior:
    scaleUp:
      # "a lot of load" = CPU stays over target for this long, not a transient spike.
      stabilizationWindowSeconds: {{ $a.scaleUpStabilizationSeconds }}
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60   # add at most 1 pod/min: gentle ramp, quota-friendly
{{- end }}
{{- end }}
