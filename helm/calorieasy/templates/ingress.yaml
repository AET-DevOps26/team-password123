{{- if and .Values.ingress.enabled .Values.ingress.host }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: calorieasy
  labels:
    {{- include "calorieasy.labels" . | nindent 4 }}
  {{- if or .Values.ingress.annotations .Values.abTest.enabled }}
  annotations:
    {{- with .Values.ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- if .Values.abTest.enabled }}
    # Pin each session to one variant while an A/B experiment runs. Without this
    # the canary weight splits per-request: variant A's index.html asks for its
    # hashed /assets/*.js, the request lands on variant B, and its SPA fallback
    # returns index.html as "JS" — broken page for ~2·w·(1−w) of loads.
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/session-cookie-name: "route"
    {{- end }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- if .Values.monitoring.enabled }}
          # More-specific prefix than "/"; nginx matches longest-prefix.
          - path: /grafana
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tls.secretName | quote }}
  {{- end }}
{{- end }}
