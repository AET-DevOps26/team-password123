{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "calorieasy.secretName" . }}
  labels:
    {{- include "calorieasy.labels" . | nindent 4 }}
type: Opaque
stringData:
  APP_JWT_PRIVATE_KEY: {{ required "jwt.privateKey is required (RS256 PKCS#8 PEM body, base64; generate with node scripts/gen-jwt-keys.mjs), or set secrets.existingSecret" .Values.jwt.privateKey | quote }}
  POSTGRES_PASSWORD: {{ required "postgres.password is required, e.g. --set postgres.password=$(openssl rand -hex 24), or set secrets.existingSecret" .Values.postgres.password | quote }}
  OPENAI_API_KEY: {{ .Values.genai.openaiApiKey | quote }}
  BACKUP_OPENAI_API_KEY: {{ .Values.genai.backupOpenaiApiKey | quote }}
  TEXT_OPENAI_API_KEY: {{ .Values.genai.textOpenaiApiKey | quote }}
  USDA_FDC_API_KEY: {{ .Values.genai.usdaApiKey | quote }}
{{- if .Values.monitoring.enabled }}
  GRAFANA_ADMIN_PASSWORD: {{ required "monitoring.grafana.adminPassword is required (Grafana is internet-facing), e.g. --set monitoring.grafana.adminPassword=$(openssl rand -hex 16), or set secrets.existingSecret" .Values.monitoring.grafana.adminPassword | quote }}
{{- end }}
{{- end }}
