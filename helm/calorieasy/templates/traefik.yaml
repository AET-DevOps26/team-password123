{{- if .Values.traefik.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: traefik-dynamic
  labels:
    {{- include "calorieasy.labels" . | nindent 4 }}
data:
  dynamic.yml: |
    http:
      routers:
        api-auth:
          rule: "PathPrefix(`/api/auth`) || PathPrefix(`/api/users`) || PathPrefix(`/api/features`)"
          entryPoints: [web]
          service: auth
          priority: 100
        api-meals:
          rule: "PathPrefix(`/api/meals`)"
          entryPoints: [web]
          service: meals
          priority: 100
        api-analytics:
          rule: "PathPrefix(`/api/analytics`) || PathPrefix(`/api/goals`)"
          entryPoints: [web]
          service: analytics
          priority: 100
        web:
          rule: "PathPrefix(`/`)"
          entryPoints: [web]
          service: web
          priority: 1
      services:
        auth:
          loadBalancer:
            servers:
              - url: "http://auth-service:8081"
        meals:
          loadBalancer:
            servers:
              - url: "http://meals-service:8082"
        analytics:
          loadBalancer:
            servers:
              - url: "http://analytics-service:8083"
        web:
          loadBalancer:
            servers:
              - url: "http://web:80"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traefik
  labels:
    app: traefik
    {{- include "calorieasy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.traefik.replicas }}
  selector:
    matchLabels:
      app: traefik
  template:
    metadata:
      labels:
        app: traefik
    spec:
      containers:
        - name: traefik
          image: {{ .Values.traefik.image }}
          args:
            - "--entryPoints.web.address=:80"
            - "--providers.file.filename=/config/dynamic.yml"
            - "--providers.file.watch=true"
            # No --api.insecure: it serves the dashboard + full routing API on
            # :8080 with no auth. Nothing here uses the dashboard, so it's off.
          ports:
            - name: web
              containerPort: 80
          volumeMounts:
            - name: dynamic
              mountPath: /config
          readinessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 15
          resources:
            {{- toYaml .Values.traefik.resources | nindent 12 }}
      volumes:
        - name: dynamic
          configMap:
            name: traefik-dynamic
---
apiVersion: v1
kind: Service
metadata:
  name: traefik
  labels:
    app: traefik
    {{- include "calorieasy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.traefik.service.type }}
  selector:
    app: traefik
  ports:
    - name: web
      port: 80
      targetPort: 80
      {{- if and (eq .Values.traefik.service.type "NodePort") .Values.traefik.service.nodePort }}
      nodePort: {{ .Values.traefik.service.nodePort }}
      {{- end }}
{{- end }}
