{{- if .Values.weaviate.enabled }}
# Vector store backing the GenAI health-insights RAG. We supply our own vectors
# (vectorizer=none), so no Weaviate inference modules run here.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: weaviate-data
  labels:
    {{- include "calorieasy.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.weaviate.storageClass }}
  storageClassName: {{ .Values.weaviate.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.weaviate.storageSize | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: weaviate
  labels:
    app: weaviate
    {{- include "calorieasy.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: weaviate
  template:
    metadata:
      labels:
        app: weaviate
    spec:
      containers:
        - name: weaviate
          image: {{ .Values.weaviate.image }}
          args: ["--host", "0.0.0.0", "--port", "8080", "--scheme", "http"]
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 50051, name: grpc }
            - { containerPort: 2112, name: metrics }
          env:
            - { name: PERSISTENCE_DATA_PATH, value: /var/lib/weaviate }
            - { name: DEFAULT_VECTORIZER_MODULE, value: none }
            - { name: ENABLE_MODULES, value: "" }
            - { name: AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED, value: "true" }
            - { name: QUERY_DEFAULTS_LIMIT, value: "25" }
            - { name: CLUSTER_HOSTNAME, value: node1 }
            - { name: PROMETHEUS_MONITORING_ENABLED, value: "true" }
          volumeMounts:
            - name: data
              mountPath: /var/lib/weaviate
          readinessProbe:
            httpGet: { path: /v1/.well-known/ready, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/.well-known/live, port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            {{- toYaml .Values.weaviate.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: weaviate-data
---
apiVersion: v1
kind: Service
metadata:
  name: weaviate
  labels:
    app: weaviate
    {{- include "calorieasy.labels" . | nindent 4 }}
spec:
  selector:
    app: weaviate
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: grpc, port: 50051, targetPort: 50051 }
    - { name: metrics, port: 2112, targetPort: 2112 }
{{- end }}
