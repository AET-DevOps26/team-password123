apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    {{- include "calorieasy.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # nginx resolves the backend service names at startup, so wait for them to exist.
        - name: wait-for-backends
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z auth-service 8081 && nc -z meals-service 8082 && nc -z analytics-service 8083; do echo waiting for backends; sleep 2; done']
      containers:
        - name: web
          image: {{ include "calorieasy.image" (dict "root" $ "name" "web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 80 }
            periodSeconds: 15
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
    {{- include "calorieasy.labels" . | nindent 4 }}
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
