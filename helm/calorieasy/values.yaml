# Image coordinates. Images are built/pushed to GHCR by the build-images workflow
# as ghcr.io/<repository>/<service>:<tag>.
image:
  registry: ghcr.io
  repository: aet-devops26/team-password123
  tag: latest
  pullPolicy: IfNotPresent

# Pull secret for the private GHCR packages (created out-of-band via kubectl).
imagePullSecrets:
  - name: ghcr-pull

# Secret provisioning. Leave existingSecret empty to let the chart create
# "calorieasy-secrets" from the values below (jwt.secret + postgres.password are
# then REQUIRED — a deploy without them fails closed). For production, create a
# Secret out-of-band with keys APP_JWT_SECRET, POSTGRES_PASSWORD, OPENAI_API_KEY,
# BACKUP_OPENAI_API_KEY, TEXT_OPENAI_API_KEY, USDA_FDC_API_KEY, GRAFANA_ADMIN_PASSWORD and set its name
# here so secrets never live in values/history:
#   kubectl -n <ns> create secret generic calorieasy-secrets \
#     --from-literal=APP_JWT_SECRET=$(openssl rand -hex 32) \
#     --from-literal=POSTGRES_PASSWORD=$(openssl rand -hex 24) ...
secrets:
  existingSecret: ""

# Shared JWT signing key — all services validate with it; only auth-service issues
# tokens. HS256 requires >= 32 bytes. Provide at install (chart-managed Secret):
#   --set jwt.secret=$(openssl rand -hex 32)
# No default: a working key must never be committed.
jwt:
  secret: ""
  expiration: "PT24H"

postgres:
  image: postgres:16-alpine
  db: nutrition
  user: nutrition
  # No default: provide at install via --set postgres.password=$(openssl rand -hex 24)
  password: ""
  storageClass: ""        # "" -> cluster default (csi-rbd-sc on the AET cluster)
  storageSize: 2Gi
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# Resource profile shared by the three Spring Boot services.
java:
  resources:
    requests: { cpu: "150m", memory: "320Mi" }
    limits:   { cpu: "750m", memory: "640Mi" }

meals:
  uploadsStorageClass: ""
  uploadsStorageSize: 1Gi
  # In-cluster GenAI service URL. When set (and genai.enabled), meals-service
  # routes photo analysis to the vision LLM instead of the heuristic placeholder.
  genaiUrl: "http://genai-service:8084"

genai:
  enabled: true
  llmProvider: openai          # OpenAI-compatible provider used for photo analysis (vision)
  # ── Vision / photo scan. ACTIVE: Google Gemini. ──────────────────────────────
  openaiBaseUrl: "https://generativelanguage.googleapis.com/v1beta/openai/"
  openaiModel: "gemini-3.1-flash-lite"   # vision-capable, free-tier quota on the project
  openaiApiKey: ""             # Google AI Studio key — provide via --set or CI secret
  # ── Backup vision model (OpenRouter Nemotron). Used when Gemini fails. ─────
  # URL + model are committed here; only the key is a secret (CI:
  # --set genai.backupOpenaiApiKey=${{ secrets.OPENROUTER_API_KEY }}).
  backupOpenaiBaseUrl: "https://openrouter.ai/api/v1"
  backupOpenaiModel: "nvidia/nemotron-nano-12b-v2-vl:free"
  backupOpenaiApiKey: ""
  # STAGED swap → Logos gemma-4 (once AET grants google/gemma-4-26B-A4B-it to the
  # key; until then it 404s). To cut over, set these three — gemma-4 reuses the
  # Logos key, same as the text LLM below:
  #   openaiBaseUrl: "https://logos.aet.cit.tum.de/v1"
  #   openaiModel:   "google/gemma-4-26B-A4B-it"
  #   openaiApiKey:  <Logos key>   (CI: --set genai.openaiApiKey=${{ secrets.LOGOS_API_KEY }})
  # ─────────────────────────────────────────────────────────────────────────────
  # Dedicated text LLM for food-name estimation + the health-insight RAG
  # generation. Defaults to AET Logos gpt-oss-120b; only the key is a secret
  # (CI passes --set genai.textOpenaiApiKey=${{ secrets.LOGOS_API_KEY }}).
  textOpenaiBaseUrl: "https://logos.aet.cit.tum.de/v1"
  textOpenaiModel: "openai/gpt-oss-120b"
  textOpenaiApiKey: ""
  nutritionDataProvider: local # use the bundled nutrition_db.json (no USDA key needed)
  usdaApiKey: ""
  # RAG health-insights embedding provider: local (in-process fastembed, no key) or openai.
  embedProvider: local
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# Vector store for the GenAI health-insights RAG (we supply vectors, vectorizer=none).
weaviate:
  enabled: true
  url: "http://weaviate:8080"
  image: cr.weaviate.io/semitechnologies/weaviate:1.27.0
  storageClass: ""
  storageSize: 2Gi
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "750m", memory: "1Gi" }

web:
  replicas: 2
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits:   { cpu: "250m", memory: "128Mi" }

# Horizontal Pod Autoscaling (CPU-based, autoscaling/v2). Only workloads proven
# stateless-safe belong in `targets`. auth-service is the clean win: bcrypt is
# genuinely on-CPU, so CPU utilisation actually tracks login load.
# Deliberately NOT autoscaled: meals-service (RWO uploads PVC pins it to 1 pod),
# postgres/weaviate (stateful singletons), genai-service (all replicas share one
# rate-limited free-tier LLM key — more pods just means more 429s, not throughput).
# REQUIRES metrics-server in the cluster: `kubectl top pods` must return numbers,
# else the HPA sits at <unknown>/70% and never scales.
# Listing a workload here also drops its static `replicas:` field (see _helpers.tpl
# calorieasy.hpaManaged) so `helm upgrade` on every deploy doesn't fight the HPA.
autoscaling:
  enabled: true
  targetCPUUtilizationPercentage: 70   # add a pod when sustained CPU > 70% of the request
  scaleUpStabilizationSeconds: 60      # "a lot of load" = sustained >=60s, not a spike
  # scale-DOWN is intentionally omitted -> inherits Kubernetes' default 300s
  # stabilization window: scales in only after 5 min of low load, so it won't flap.
  targets:
    auth-service:
      minReplicas: 1
      maxReplicas: 4   # Postgres wall: (4 auth + 1 analytics + 1 meals) x 10 Hikari conns = 60 < 97
    # web is off by default: nginx is so cheap per request it almost never trips 70%
    # of its 50m request, so the HPA would just sit at min. Uncomment to demo scaling
    # the front door (the replicas guard below already handles it):
    # web:
    #   minReplicas: 2
    #   maxReplicas: 4

# Observability — in-namespace Prometheus + Grafana (no operator/CRDs, no
# cluster-scoped RBAC). Prometheus scrapes the services via static in-cluster DNS
# and stays ClusterIP (internal-only); Grafana is exposed online at <host>/grafana
# (login-gated) through the shared Ingress.
monitoring:
  enabled: true
  prometheus:
    image: prom/prometheus:v2.55.1
    retention: 7d
    scrapeInterval: 15s
    # ponytail: emptyDir — metrics are ephemeral. Flip enabled:true for a PVC if
    # you need history to survive pod restarts.
    persistence:
      enabled: false
      storageClass: ""
      size: 2Gi
    resources:
      requests: { cpu: "50m", memory: "256Mi" }
      limits:   { cpu: "300m", memory: "512Mi" }
  grafana:
    image: grafana/grafana:11.4.0
    adminUser: admin
    # No default: Grafana is internet-facing, so a password must be supplied at
    # install via --set monitoring.grafana.adminPassword=... (fails closed).
    adminPassword: ""
    resources:
      requests: { cpu: "50m", memory: "128Mi" }
      limits:   { cpu: "250m", memory: "256Mi" }

# Traefik runs in-namespace as the L7 load balancer / router in front of the app.
# The AET cluster exposes no Traefik ingress class, so we ship our own via the
# file provider — no cluster-scoped RBAC or CRDs required. It routes /api/* to the
# backend services and / to the (multi-replica) web tier, load-balancing each.
traefik:
  enabled: true
  image: traefik:v3.1
  replicas: 1
  service:
    type: ClusterIP   # set NodePort (+ nodePort) or LoadBalancer to expose externally
    nodePort: ""
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits:   { cpu: "300m", memory: "128Mi" }

ingress:
  enabled: true
  className: nginx
  host: "team-password123-devops-ss26.stud.k8s.aet.cit.tum.de"  # AET wildcard: <id>-devops-ss26.stud.k8s.aet.cit.tum.de
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod   # cert-manager auto-issues a trusted TLS cert
    # Allow meal-photo uploads: the app sends downscaled JPEGs, but the ingress-nginx
    # default body cap (~1MB) would still 413 larger captures before they reach the
    # pod (in-pod nginx already allows 10m; meals-service allows 10MB).
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
  tls:
    enabled: true
    secretName: team-password123-tls
