---
- name: Deploy Calorieasy via Docker Compose
  hosts: all
  become: true
  vars:
    app_dir: /opt/calorieasy
    ghcr_user: "{{ ghcr_user | default('') }}"
    ghcr_token: "{{ ghcr_token | default('') }}"
  tasks:
    - name: Install prerequisites
      ansible.builtin.apt:
        name: [ca-certificates, curl, gnupg]
        update_cache: true
        state: present

    - name: Create apt keyrings dir
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Add Docker GPG key
      ansible.builtin.apt_key:
        url: https://download.docker.com/linux/ubuntu/gpg
        keyring: /etc/apt/keyrings/docker.gpg
        state: present

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Install Docker Engine + Compose plugin
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
        update_cache: true
        state: present

    - name: Ensure Docker is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Log in to GHCR
      when: ghcr_token | length > 0
      ansible.builtin.command:
        cmd: docker login ghcr.io -u "{{ ghcr_user }}" --password-stdin
        stdin: "{{ ghcr_token }}"
      no_log: true
      changed_when: false

    - name: Create app directory
      ansible.builtin.file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0750"

    - name: Copy compose file
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../docker-compose.prod.yml"
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0640"

    - name: Copy postgres init scripts
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../infra/postgres/init/"
        dest: "{{ app_dir }}/infra/postgres/init/"
        mode: "0644"

    - name: Template .env
      ansible.builtin.template:
        src: env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Pull images
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ app_dir }}"
      changed_when: true

    - name: Start the stack
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ app_dir }}"
      changed_when: true
