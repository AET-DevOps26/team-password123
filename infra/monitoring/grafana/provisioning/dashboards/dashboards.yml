# Auto-load every dashboard JSON found under /var/lib/grafana/dashboards
# (recursively). docker-compose mounts the metrics dashboards there from the
# Helm chart dir and the Loki/logs dashboards from infra/monitoring/grafana.
apiVersion: 1
providers:
  - name: default
    orgId: 1
    folder: ''
    type: file
    disableDeletion: true
    editable: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
