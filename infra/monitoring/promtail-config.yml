# Promtail ships every compose container's stdout/stderr to Loki. It discovers
# containers through the Docker socket and streams their logs over the Docker
# API, so no /var/lib/docker bind mount is needed (works on Docker Desktop too).
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: service
    pipeline_stages:
      # Pull a log level out of either the Spring (logback) or the Python line
      # format so Grafana can break log volume down by level.
      - regex:
          expression: '(?P<level>TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL)'
      - labels:
          level:
