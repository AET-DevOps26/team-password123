spring:
  application:
    name: analytics-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nutrition?currentSchema=analytics}
    username: ${SPRING_DATASOURCE_USERNAME:nutrition}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: analytics
    open-in-view: false
  flyway:
    schemas: analytics
    default-schema: analytics

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Distributed tracing -> OTLP (Tempo). OFF by default so local runs and tests
  # emit no spans; the k8s deployment sets MANAGEMENT_TRACING_ENABLED=true when
  # .Values.tracing.enabled. Endpoint defaults to the in-cluster Tempo collector.
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

app:
  jwt:
    # RS256 verification key (X.509/SPKI PEM or its headerless base64 body).
    # Verify-only: this service cannot mint tokens; auth-service signs them
    # with the matching private key.
    public-key: ${APP_JWT_PUBLIC_KEY}
  meals-service:
    base-url: ${MEALS_SERVICE_URL:http://localhost:8082}
  genai:
    base-url: ${GENAI_URL:http://genai-service:8084}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# Verbose logging only for local development (SPRING_PROFILES_ACTIVE=local);
# every other environment stays on the default INFO level.
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    com.teampassword123: DEBUG
    org.hibernate.SQL: DEBUG
