spring:
  application:
    name: analytics-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nutrition?currentSchema=analytics}
    username: ${SPRING_DATASOURCE_USERNAME:nutrition}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: analytics
    open-in-view: false
  flyway:
    schemas: analytics
    default-schema: analytics

server:
  port: ${SERVER_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    com.teampassword123: DEBUG
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  meals-service:
    base-url: ${MEALS_SERVICE_URL:http://localhost:8082}
  genai:
    base-url: ${GENAI_URL:http://genai-service:8084}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
