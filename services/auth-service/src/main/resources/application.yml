spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nutrition?currentSchema=auth}
    username: ${SPRING_DATASOURCE_USERNAME:nutrition}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
    open-in-view: false
  flyway:
    schemas: auth
    default-schema: auth

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Publish latency histogram buckets so Grafana's histogram_quantile() p95/p99
      # panels work (without this they show "No data").
      percentiles-histogram:
        http.server.requests: true

logging:
  level:
    com.teampassword123: DEBUG
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration: ${APP_JWT_EXPIRATION:PT24H}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
