spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nutrition?currentSchema=auth}
    username: ${SPRING_DATASOURCE_USERNAME:nutrition}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: auth
    open-in-view: false
  flyway:
    schemas: auth
    default-schema: auth

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Publish latency histogram buckets so Grafana's histogram_quantile() p95/p99
      # panels work (without this they show "No data").
      percentiles-histogram:
        http.server.requests: true
  # Distributed tracing -> OTLP (Tempo). OFF by default so local runs and tests
  # emit no spans; the k8s deployment sets MANAGEMENT_TRACING_ENABLED=true when
  # .Values.tracing.enabled. Endpoint defaults to the in-cluster Tempo collector.
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

app:
  jwt:
    # RS256 signing key (PKCS#8 PEM or its headerless base64 body). Only
    # auth-service holds the private key; resource services verify with the
    # public key. Generate a pair with: node scripts/gen-jwt-keys.mjs
    private-key: ${APP_JWT_PRIVATE_KEY}
    expiration: ${APP_JWT_EXPIRATION:PT24H}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# Verbose logging only for local development (SPRING_PROFILES_ACTIVE=local);
# every other environment stays on the default INFO level.
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    com.teampassword123: DEBUG
    org.hibernate.SQL: DEBUG
