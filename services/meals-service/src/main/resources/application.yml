spring:
  application:
    name: meals-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/nutrition?currentSchema=meals}
    username: ${SPRING_DATASOURCE_USERNAME:nutrition}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: meals
    open-in-view: false
  flyway:
    schemas: meals
    default-schema: meals
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  # Distributed tracing -> OTLP (Tempo). OFF by default so local runs and tests
  # emit no spans; the k8s deployment sets MANAGEMENT_TRACING_ENABLED=true when
  # .Values.tracing.enabled. Endpoint defaults to the in-cluster Tempo collector.
  tracing:
    enabled: ${MANAGEMENT_TRACING_ENABLED:false}
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${MANAGEMENT_OTLP_TRACING_ENDPOINT:http://tempo:4318/v1/traces}

app:
  jwt:
    secret: ${APP_JWT_SECRET}
  storage:
    upload-dir: ${APP_UPLOAD_DIR:uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# Verbose logging only for local development (SPRING_PROFILES_ACTIVE=local);
# every other environment stays on the default INFO level.
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    com.teampassword123: DEBUG
    org.hibernate.SQL: DEBUG
